name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Downloads the original jar and extracts the art, maps and text the tests and build read.
      - run: bun run assets
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      # Screenshot baselines show Macrospace's art, so none are committed: CI records its own
      # (as a first local run does) instead of failing on the missing file.
      - run: bun run test:e2e --update-snapshots=missing
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
